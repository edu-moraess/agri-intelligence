[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-intelligence"
version = "0.1.0"
description = "Foundation for traceable agricultural and geospatial intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "ArqTech Labs"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7,<9"]
image = ["Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
